<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地文件 · DSH</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f7;
    --panel: #ffffff;
    --line: #e3e5e8;
    --text: #0f1115;
    --muted: #6b7280;
    --accent: #4176e6;
    --accent-soft: rgba(65, 118, 230, 0.1);
    --danger: #d92d20;
    --row-hover: rgba(0, 0, 0, 0.04);
    --sel: rgba(65, 118, 230, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151517;
      --panel: #1c1c1f;
      --line: #2c2c31;
      --text: #f9fafb;
      --muted: #9aa0aa;
      --accent: #679efe;
      --accent-soft: rgba(103, 158, 254, 0.16);
      --danger: #ff6b6b;
      --row-hover: rgba(255, 255, 255, 0.05);
      --sel: rgba(103, 158, 254, 0.2);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .brand { font-weight: 600; font-size: 14px; white-space: nowrap; }
  .brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .roots { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    border-radius: 999px;
    padding: 3px 10px;
    font: inherit;
    cursor: pointer;
  }
  .chip:hover { background: var(--row-hover); }
  .chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  form.jump { display: flex; gap: 6px; flex: 1 1 260px; min-width: 200px; }
  form.jump input {
    flex: 1;
    min-width: 0;
    height: 30px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  form.jump input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  button.action, a.action {
    height: 30px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    text-decoration: none;
  }
  button.action:hover, a.action:hover { background: var(--row-hover); }
  button.action:disabled { opacity: 0.42; cursor: default; }
  button.action.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.action.primary:hover { filter: brightness(1.05); }
  main { flex: 1; display: grid; grid-template-columns: minmax(360px, 1fr) minmax(320px, 1.05fr); min-height: 0; }
  section { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  #listPane { border-right: 1px solid var(--line); }
  #crumbs { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .crumb { border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; padding: 0 2px; }
  .crumb.sep { color: var(--muted); cursor: default; }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex-wrap: wrap;
    font-size: 12px;
  }
  #toolbar .spacer { flex: 1; }
  #selInfo, #clipHint { color: var(--muted); white-space: nowrap; }
  #clipHint { color: var(--accent); }
  .tool {
    height: 26px;
    padding: 0 10px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .tool:hover { background: var(--row-hover); }
  .tool:disabled { opacity: 0.4; cursor: default; }
  .tool.danger { color: var(--danger); border-color: rgba(217, 45, 32, 0.35); }
  .tool.danger:hover { background: rgba(217, 45, 32, 0.08); }
  .uploadLabel {
    position: relative;
    height: 26px;
    padding: 0 10px;
    border-radius: 7px;
    border: 1px solid var(--line);
    display: inline-flex;
    align-items: center;
    cursor: pointer;
    font-size: 12px;
  }
  .uploadLabel:hover { background: var(--row-hover); }
  .uploadLabel input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  #listHead, .row {
    display: grid;
    grid-template-columns: 26px 1fr 86px 132px 104px;
    gap: 8px;
    align-items: center;
    padding: 5px 12px;
  }
  #listHead { color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #list { flex: 1; overflow: auto; position: relative; }
  .row { border-bottom: 1px solid transparent; }
  .row.file { cursor: pointer; }
  .row:hover { background: var(--row-hover); }
  .row.selected { background: var(--sel); }
  #list.dropping { outline: 2px dashed var(--accent); outline-offset: -4px; }
  .name { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .name .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name .icon { flex: none; width: 18px; text-align: center; opacity: 0.85; }
  .dir .label { font-weight: 500; }
  .size, .time { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ops { text-align: right; white-space: nowrap; }
  .ops a {
    color: var(--accent);
    text-decoration: none;
    font-size: 12px;
    padding: 2px 5px;
    border-radius: 6px;
  }
  .ops a:hover { background: var(--accent-soft); }
  input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; }
  #previewPane { background: var(--panel); }
  #pvHead {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    min-height: 46px;
    flex-wrap: wrap;
  }
  #pvName { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 120px; min-width: 0; }
  #pvMeta { color: var(--muted); font-size: 12px; }
  #pvBody { flex: 1; overflow: auto; display: flex; align-items: stretch; justify-content: stretch; }
  #pvBody > * { max-width: 100%; }
  #pvBody pre {
    margin: 0;
    padding: 12px;
    flex: 1;
    overflow: auto;
    font: 12px/1.55 ui-monospace, Consolas, "Cascadia Mono", monospace;
    white-space: pre;
    tab-size: 4;
  }
  #pvBody img { display: block; margin: 12px auto; max-width: calc(100% - 24px); max-height: calc(100vh - 140px); object-fit: contain; }
  #pvBody iframe { flex: 1; width: 100%; border: 0; min-height: 60vh; background: #fff; }
  #pvBody video, #pvBody audio { margin: 12px; max-width: calc(100% - 24px); }
  #pvBody textarea.editor {
    flex: 1;
    width: 100%;
    min-height: 0;
    border: 0;
    outline: 0;
    resize: none;
    padding: 14px 16px;
    font: 12px/1.6 ui-monospace, Consolas, "Cascadia Mono", monospace;
    background: var(--panel);
    color: var(--text);
    white-space: pre;
    tab-size: 4;
  }
  .md { padding: 16px 20px; flex: 1; overflow: auto; line-height: 1.65; }
  .md h1 { font-size: 1.5em; margin: 0.4em 0 0.5em; }
  .md h2 { font-size: 1.28em; margin: 0.5em 0 0.4em; }
  .md h3, .md h4, .md h5, .md h6 { font-size: 1.1em; margin: 0.5em 0 0.35em; }
  .md p { margin: 0.5em 0; }
  .md code { background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; font-family: ui-monospace, Consolas, monospace; font-size: 0.92em; }
  .md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow: auto; margin: 0.6em 0; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { margin: 0.6em 0; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .md ul, .md ol { margin: 0.4em 0 0.4em 1.4em; padding: 0; }
  .md li { margin: 0.18em 0; }
  .md a { color: var(--accent); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
  .docxView { padding: 18px 24px; flex: 1; overflow: auto; line-height: 1.7; }
  .docxView h1 { font-size: 1.55em; margin: 0.5em 0; }
  .docxView h2 { font-size: 1.3em; margin: 0.5em 0 0.4em; }
  .docxView h3, .docxView h4 { font-size: 1.12em; margin: 0.5em 0 0.3em; }
  .docxView p { margin: 0.55em 0; }
  .docxView img { max-width: 100%; }
  .docxView table { border-collapse: collapse; margin: 0.7em 0; }
  .docxView th, .docxView td { border: 1px solid var(--line); padding: 4px 9px; }
  .docxView a { color: var(--accent); }
  .docxView blockquote { margin: 0.6em 0; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .sheetTabs { display: flex; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: 0 0 auto; background: var(--panel); }
  .sheetTab { height: 24px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .sheetTab.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .sheetNote { padding: 6px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); flex: 0 0 auto; }
  .indet { width: 220px; height: 5px; border-radius: 4px; background: var(--line); overflow: hidden; position: relative; margin-top: 4px; }
  .indet > div { position: absolute; left: -40%; width: 40%; height: 100%; background: var(--accent); border-radius: 4px; animation: indet 1.15s ease-in-out infinite; }
  @keyframes indet { 0% { left: -40%; } 100% { left: 100%; } }
  table.grid { border-collapse: collapse; font-size: 12px; }
  table.grid th, table.grid td { border: 1px solid var(--line); padding: 4px 8px; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  table.grid th { background: var(--bg); position: sticky; top: 0; }
  td.editable { cursor: cell; }
  td.editing { padding: 0; }
  td.editing input {
    width: 100%;
    min-width: 72px;
    border: 1px solid var(--accent);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 3px 6px;
  }
  .empty {
    margin: auto;
    padding: 28px;
    text-align: center;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }
  .empty .big { font-size: 34px; opacity: 0.5; }
  .empty strong { color: var(--text); font-weight: 600; }
  .note { padding: 10px 12px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--danger);
    color: #fff;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
    max-width: 80vw;
    z-index: 20;
  }
  #toast.show { opacity: 1; }
  #toast.ok { background: #12805c; }
  #progress {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 12px;
    color: var(--muted);
    display: none;
    z-index: 5;
  }
  #progress.show { display: block; }
  #progressBar { height: 4px; border-radius: 3px; background: var(--line); margin-top: 5px; overflow: hidden; }
  #progressBar > div { height: 100%; width: 0; background: var(--accent); transition: width 0.12s linear; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(240px, 1fr) minmax(260px, 1.1fr); }
    #listPane { border-right: 0; border-bottom: 1px solid var(--line); }
    #listHead, .row { grid-template-columns: 26px 1fr 74px 74px; }
    .time { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">本地文件<small>DSH</small></div>
  <div class="roots" id="roots"></div>
  <form class="jump" id="jumpForm">
    <input id="pathInput" placeholder="输入绝对路径，例如 D:\project" spellcheck="false" autocomplete="off">
    <button class="action primary" type="submit">跳转</button>
  </form>
  <button class="action" id="refreshBtn" type="button">刷新</button>
  <a class="action" id="backToDsh" href="/">返回 DSH</a>
</header>
<main>
  <section id="listPane">
    <div id="crumbs"></div>
    <div id="toolbar">
      <label><input type="checkbox" id="selAll"> 全选</label>
      <span id="selInfo">已选 0 项</span>
      <button class="tool" id="copyBtn" type="button" disabled>复制</button>
      <button class="tool" id="pasteBtn" type="button" disabled>粘贴</button>
      <button class="tool" id="zipBtn" type="button">打包下载</button>
      <label class="uploadLabel">上传<input type="file" id="fileInput" multiple></label>
      <button class="tool" id="newFileBtn" type="button">新建文件</button>
      <button class="tool" id="newDirBtn" type="button">新建文件夹</button>
      <button class="tool" id="renameBtn" type="button" disabled>重命名</button>
      <button class="tool danger" id="deleteBtn" type="button" disabled>删除</button>
      <span class="spacer"></span>
      <span id="clipHint"></span>
    </div>
    <div id="listHead"><div><input type="checkbox" id="selAllHead" aria-label="全选"></div><div>名称</div><div>大小</div><div class="time">修改时间</div><div style="text-align:right">操作</div></div>
    <div id="list"></div>
    <div id="progress"><div id="progressText"></div><div id="progressBar"><div></div></div></div>
  </section>
  <section id="previewPane">
    <div id="pvHead"><div id="pvName">预览</div><div id="pvMeta"></div></div>
    <div id="pvBody">
      <div class="empty">
        <div class="big">📄</div>
        <div><strong>选择一个文件</strong></div>
        <div>点击左侧文件在此预览；不支持预览的类型可直接下载。</div>
      </div>
    </div>
  </section>
</main>
<div id="toast"></div>
<script>
(function () {
  'use strict'

  var TEXT_LIMIT = 512 * 1024
  var IMAGE = ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.bmp', '.ico', '.avif', '.svg']
  var VIDEO = ['.mp4', '.webm', '.mov', '.mkv']
  var AUDIO = ['.mp3', '.wav', '.ogg', '.m4a', '.flac']
  var TEXT = ['.txt', '.log', '.md', '.markdown', '.json', '.jsonc', '.yaml', '.yml', '.toml', '.ini',
    '.csv', '.tsv', '.xml', '.html', '.htm', '.css', '.js', '.mjs', '.cjs', '.ts', '.tsx', '.jsx',
    '.py', '.go', '.rs', '.java', '.c', '.h', '.cpp', '.cs', '.sh', '.ps1', '.bat', '.cmd', '.env', '.gitignore']
  var OFFICE = ['.doc', '.docx', '.xls', '.xlsx', '.xlsm', '.ods', '.ppt', '.pptx']
  var CLIENT_DOCX = ['.docx']
  var CLIENT_SHEET = ['.xlsx', '.xls', '.xlsm', '.ods']
  var CONVERTIBLE = ['.doc', '.docx', '.xls', '.xlsx', '.ppt', '.pptx']
  var SHEET_MAX_ROWS = 2000
  var SHEET_MAX_COLS = 120
  var SHEET_MAX_CELLS = 120000
  var SHEET_MAX_SHEETS = 50

  var state = {
    dir: null,
    parent: null,
    entries: [],
    selected: {},
    selectedCount: 0,
    clipboard: null,
    roots: [],
    home: null,
    previewSeq: 0,
    editor: null
  }
  var el = {
    roots: document.getElementById('roots'),
    crumbs: document.getElementById('crumbs'),
    list: document.getElementById('list'),
    pathInput: document.getElementById('pathInput'),
    jumpForm: document.getElementById('jumpForm'),
    refreshBtn: document.getElementById('refreshBtn'),
    selAll: document.getElementById('selAll'),
    selAllHead: document.getElementById('selAllHead'),
    selInfo: document.getElementById('selInfo'),
    copyBtn: document.getElementById('copyBtn'),
    pasteBtn: document.getElementById('pasteBtn'),
    zipBtn: document.getElementById('zipBtn'),
    fileInput: document.getElementById('fileInput'),
    newFileBtn: document.getElementById('newFileBtn'),
    newDirBtn: document.getElementById('newDirBtn'),
    renameBtn: document.getElementById('renameBtn'),
    deleteBtn: document.getElementById('deleteBtn'),
    clipHint: document.getElementById('clipHint'),
    progress: document.getElementById('progress'),
    progressText: document.getElementById('progressText'),
    progressBar: document.querySelector('#progressBar > div'),
    pvName: document.getElementById('pvName'),
    pvMeta: document.getElementById('pvMeta'),
    pvBody: document.getElementById('pvBody'),
    toast: document.getElementById('toast')
  }

  function ext(p) {
    var base = String(p).split(/[\\/]/).pop() || ''
    var i = base.lastIndexOf('.')
    return i < 0 ? '' : base.slice(i).toLowerCase()
  }
  function inList(list, p) { return list.indexOf(ext(p)) >= 0 }
  function enc(p) { return encodeURIComponent(p) }
  function downloadUrl(p) { return '/-/files/api/download?path=' + enc(p) }
  function rawUrl(p) { return '/-/files/api/raw?path=' + enc(p) }
  function zipUrl(paths) {
    return '/-/files/api/zip?' + paths.map(function (p) { return 'path=' + enc(p) }).join('&')
  }
  function baseName(p) { return String(p).split(/[\\/]/).pop() }
  function parentDir(p) { return String(p).replace(/[\\/][^\\/]+$/, '') }
  // Join one child path onto a directory with the separator that directory
  // already uses: POSIX and Windows drive/UNC paths must not be mixed.
  function joinPath(base, name) {
    var win = /^[a-zA-Z]:/.test(base) || /^\\\\/.test(base)
    return String(base).replace(/[\\/]+$/, '') + (win ? '\\' : '/') + name
  }

  function fmtSize(n) {
    if (n === null || n === undefined) return ''
    if (n < 1024) return n + ' B'
    var units = ['KB', 'MB', 'GB', 'TB']
    var v = n
    for (var i = 0; i < units.length; i++) {
      v = v / 1024
      if (v < 1024) return (v >= 100 ? v.toFixed(0) : v.toFixed(1)) + ' ' + units[i]
    }
    return v.toFixed(1) + ' PB'
  }
  function fmtTime(ms) {
    if (!ms) return ''
    var d = new Date(ms)
    function p2(x) { return x < 10 ? '0' + x : '' + x }
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes())
  }

  var toastTimer = null
  function toast(message, ok) {
    el.toast.textContent = message
    el.toast.className = 'show' + (ok ? ' ok' : '')
    if (toastTimer) clearTimeout(toastTimer)
    toastTimer = setTimeout(function () { el.toast.className = '' }, ok ? 2600 : 4500)
  }

  function getJson(url) {
    return fetch(url, { headers: { accept: 'application/json' } }).then(function (res) {
      return res.json().catch(function () { return {} }).then(function (body) {
        if (!res.ok) throw new Error(body && body.error ? body.error : 'HTTP ' + res.status)
        return body
      })
    })
  }

  function postJson(url, payload) {
    return fetch(url, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (res) {
      return res.json().catch(function () { return {} }).then(function (body) {
        if (!res.ok && res.status !== 207) throw new Error(body && body.error ? body.error : 'HTTP ' + res.status)
        return body
      })
    })
  }

  function setUrl(p) {
    var url = new URL(location.href)
    if (p) url.searchParams.set('path', p)
    else url.searchParams.delete('path')
    history.replaceState(null, '', url.toString())
  }

  function renderRoots() {
    el.roots.textContent = ''
    if (state.home) {
      var homeBtn = document.createElement('button')
      homeBtn.type = 'button'
      homeBtn.className = 'chip'
      homeBtn.textContent = '🏠 首页'
      homeBtn.title = state.home
      if (state.dir && state.home.toLowerCase() === state.dir.toLowerCase()) homeBtn.classList.add('active')
      homeBtn.addEventListener('click', function () { openHome() })
      el.roots.appendChild(homeBtn)
    }
    state.roots.forEach(function (root) {
      var btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'chip'
      btn.textContent = root.label
      btn.title = root.path
      if (state.dir && root.path.toLowerCase() === state.dir.toLowerCase()) btn.classList.add('active')
      btn.addEventListener('click', function () { loadDir(root.path) })
      el.roots.appendChild(btn)
    })
  }

  function renderCrumbs(dir) {
    el.crumbs.textContent = ''
    var raw = String(dir)
    // POSIX paths use '/', Windows drive and UNC paths use '\'. The separator
    // must follow the platform: joining with '\' on Linux produced paths like
    // "/root\.local", which the Host rightly reported as missing.
    var win = /^[a-zA-Z]:/.test(raw) || /^\\\\/.test(raw)
    var sepChar = win ? '\\' : '/'
    var parts = raw.split(/[\\/]/).filter(function (s) { return s.length > 0 })
    var drive = win && /^[a-zA-Z]:$/.test(parts[0])
    var unc = win && !drive
    var rootTarget = drive ? parts[0] + '\\' : (unc ? '\\\\' + parts[0] : '/')
    var rootBtn = document.createElement('button')
    rootBtn.type = 'button'
    rootBtn.className = 'crumb'
    rootBtn.textContent = rootTarget
    rootBtn.addEventListener('click', function () { loadDir(rootTarget) })
    el.crumbs.appendChild(rootBtn)
    var start = drive ? 1 : (unc ? 1 : 0)
    var build = rootTarget
    for (var i = start; i < parts.length; i++) {
      build = joinPath(build, parts[i])
      var sep = document.createElement('span')
      sep.className = 'crumb sep'
      sep.textContent = sepChar
      el.crumbs.appendChild(sep)
      var btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'crumb'
      btn.textContent = parts[i]
      btn.addEventListener('click', (function (target) {
        return function () { loadDir(target) }
      })(build))
      el.crumbs.appendChild(btn)
    }
  }

  function iconFor(entry) {
    if (entry.isDir) return '📁'
    var e = ext(entry.name)
    if (inList(IMAGE, e)) return '🖼️'
    if (e === '.pdf') return '📕'
    if (inList(VIDEO, e)) return '🎬'
    if (inList(AUDIO, e)) return '🎵'
    if (OFFICE.indexOf(e) >= 0) return '📘'
    if (e === '.zip' || e === '.7z' || e === '.rar') return '🗜️'
    if (inList(TEXT, e)) return '📄'
    return '📦'
  }

  function renderList(data) {
    state.entries = data.entries
    state.parent = data.parent
    el.list.textContent = ''
    if (data.entries.length === 0) {
      var empty = document.createElement('div')
      empty.className = 'note'
      empty.textContent = '空目录 —— 可直接拖文件到这里上传'
      el.list.appendChild(empty)
      updateToolbar()
      return
    }
    data.entries.forEach(function (entry) {
      var row = document.createElement('div')
      row.className = 'row ' + (entry.isDir ? 'dir' : 'file')
      row.dataset.path = entry.path

      var checkCell = document.createElement('div')
      var box = document.createElement('input')
      box.type = 'checkbox'
      box.checked = !!state.selected[entry.path]
      box.addEventListener('click', function (evt) { evt.stopPropagation() })
      box.addEventListener('change', function () { toggleSelect(entry.path, box.checked) })
      checkCell.appendChild(box)

      var name = document.createElement('div')
      name.className = 'name'
      var icon = document.createElement('span')
      icon.className = 'icon'
      icon.textContent = iconFor(entry)
      var label = document.createElement('span')
      label.className = 'label'
      label.textContent = entry.name
      label.title = entry.name
      name.appendChild(icon)
      name.appendChild(label)

      var size = document.createElement('div')
      size.className = 'size'
      size.textContent = entry.isDir ? '' : fmtSize(entry.size)

      var time = document.createElement('div')
      time.className = 'time'
      time.textContent = fmtTime(entry.mtimeMs)

      var ops = document.createElement('div')
      ops.className = 'ops'
      if (entry.isDir) {
        var za = document.createElement('a')
        za.href = zipUrl([entry.path])
        za.textContent = 'Zip'
        za.title = '打包下载此目录'
        za.addEventListener('click', function (evt) { evt.stopPropagation() })
        ops.appendChild(za)
      } else {
        var a = document.createElement('a')
        a.href = downloadUrl(entry.path)
        a.setAttribute('download', '')
        a.textContent = '下载'
        a.title = '下载到本机'
        a.addEventListener('click', function (evt) { evt.stopPropagation() })
        ops.appendChild(a)
      }

      row.appendChild(checkCell)
      row.appendChild(name)
      row.appendChild(size)
      row.appendChild(time)
      row.appendChild(ops)
      row.addEventListener('click', function () {
        if (entry.isDir) loadDir(entry.path)
        else openFile(entry.path, entry)
      })
      if (state.selected[entry.path]) row.classList.add('selected')
      el.list.appendChild(row)
    })
    updateToolbar()
  }

  function toggleSelect(p, on) {
    if (on) {
      if (!state.selected[p]) state.selectedCount += 1
      state.selected[p] = true
    } else if (state.selected[p]) {
      delete state.selected[p]
      state.selectedCount -= 1
    }
    var row = el.list.querySelector('.row[data-path="' + CSS.escape(p) + '"]')
    if (row) row.classList.toggle('selected', on)
    updateToolbar()
  }

  function selectedPaths() {
    return Object.keys(state.selected)
  }

  function updateToolbar() {
    el.selInfo.textContent = '已选 ' + state.selectedCount + ' 项'
    el.copyBtn.disabled = state.selectedCount === 0
    el.pasteBtn.disabled = !state.clipboard
    el.renameBtn.disabled = state.selectedCount !== 1
    el.deleteBtn.disabled = state.selectedCount === 0
    var all = state.selectedCount > 0 && state.selectedCount === state.entries.length
    el.selAll.checked = all
    el.selAllHead.checked = all
    el.clipHint.textContent = state.clipboard
      ? '剪贴板：' + (state.clipboard.op === 'move' ? '已剪切 ' : '已复制 ') + state.clipboard.items.length + ' 项'
      : ''
  }

  function loadDir(dir) {
    if (!dir) return
    getJson('/-/files/api/list?path=' + enc(dir)).then(function (data) {
      state.dir = data.path
      state.selected = {}
      state.selectedCount = 0
      el.pathInput.value = data.path
      setUrl(data.path)
      renderRoots()
      renderCrumbs(data.path)
      renderList(data)
      if (data.truncated) toast('目录条目过多，仅显示前 ' + data.entries.length + ' 项')
    }).catch(function (error) {
      toast('打开目录失败：' + error.message)
    })
  }

  function openHome() {
    if (!state.home) {
      if (state.roots.length > 0) loadDir(state.roots[0].path)
      return
    }
    getJson('/-/files/api/list?path=' + enc(state.home)).then(function (data) {
      state.dir = data.path
      state.selected = {}
      state.selectedCount = 0
      el.pathInput.value = data.path
      setUrl(null)
      renderRoots()
      renderCrumbs(data.path)
      renderList(data)
    }).catch(function () {
      if (state.roots.length > 0) loadDir(state.roots[0].path)
    })
  }

  // ── clipboard (copy / move) ─────────────────────────────────────────────

  function copySelection() {
    var items = selectedPaths()
    if (items.length === 0) return
    state.clipboard = { op: 'copy', items: items }
    updateToolbar()
    toast('已复制 ' + items.length + ' 项，进入目标目录后点「粘贴」', true)
  }

  function pasteClipboard() {
    if (!state.clipboard || !state.dir) return
    var clip = state.clipboard
    el.pasteBtn.disabled = true
    postJson('/-/files/api/copy', {
      sources: clip.items,
      target: state.dir,
      move: clip.op === 'move'
    }).then(function (body) {
      var results = body.results || []
      var failed = results.filter(function (item) { return !item.ok })
      if (failed.length === 0) toast('已粘贴 ' + results.length + ' 项', true)
      else toast(failed.length + ' 项失败：' + failed[0].error + (failed.length > 1 ? ' 等' : ''))
      if (clip.op === 'move') state.clipboard = null
      updateToolbar()
      loadDir(state.dir)
    }).catch(function (error) {
      toast('粘贴失败：' + error.message)
      updateToolbar()
    })
  }

  // ── upload ──────────────────────────────────────────────────────────────

  function showProgress(text, ratio) {
    el.progress.classList.add('show')
    el.progressText.textContent = text
    el.progressBar.style.width = Math.max(0, Math.min(1, ratio)) * 100 + '%'
  }
  function hideProgress() {
    el.progress.classList.remove('show')
    el.progressBar.style.width = '0'
  }

  function uploadOne(file, dir) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest()
      xhr.open('POST', '/-/files/api/upload?path=' + enc(dir))
      xhr.setRequestHeader('x-file-name', encodeURIComponent(file.name))
      xhr.setRequestHeader('content-type', 'application/octet-stream')
      xhr.upload.onprogress = function (evt) {
        if (evt.lengthComputable) {
          showProgress('上传 ' + file.name + ' ' + fmtSize(evt.loaded) + ' / ' + fmtSize(evt.total), evt.loaded / evt.total)
        }
      }
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          var body = {}
          try { body = JSON.parse(xhr.responseText) } catch (err) {}
          resolve(body)
        } else {
          var message = xhr.responseText
          try { message = JSON.parse(xhr.responseText).error || message } catch (err) {}
          reject(new Error('HTTP ' + xhr.status + ' ' + message))
        }
      }
      xhr.onerror = function () { reject(new Error('网络错误')) }
      xhr.send(file)
    })
  }

  function uploadFiles(files) {
    if (!state.dir || files.length === 0) return
    var list = Array.prototype.slice.call(files)
    var done = 0
    var failed = 0
    function next() {
      if (list.length === 0) {
        hideProgress()
        if (failed === 0) toast('已上传 ' + done + ' 个文件', true)
        else toast('上传完成 ' + done + ' 个，失败 ' + failed + ' 个')
        loadDir(state.dir)
        return
      }
      var file = list.shift()
      showProgress('上传 ' + file.name + '…', 0)
      uploadOne(file, state.dir).then(function () {
        done += 1
      }, function (error) {
        failed += 1
        toast('上传 ' + file.name + ' 失败：' + error.message)
      }).then(next)
    }
    next()
  }

  el.fileInput.addEventListener('change', function () {
    uploadFiles(el.fileInput.files)
    el.fileInput.value = ''
  })
  ;['dragenter', 'dragover'].forEach(function (name) {
    el.list.addEventListener(name, function (evt) {
      evt.preventDefault()
      el.list.classList.add('dropping')
    })
  })
  ;['dragleave', 'drop'].forEach(function (name) {
    el.list.addEventListener(name, function (evt) {
      evt.preventDefault()
      el.list.classList.remove('dropping')
    })
  })
  el.list.addEventListener('drop', function (evt) {
    if (evt.dataTransfer && evt.dataTransfer.files && evt.dataTransfer.files.length > 0) {
      uploadFiles(evt.dataTransfer.files)
    }
  })

  // ── preview helpers ─────────────────────────────────────────────────────

  function previewMessage(icon, title, detail, filePath) {
    var wrap = document.createElement('div')
    wrap.className = 'empty'
    var big = document.createElement('div')
    big.className = 'big'
    big.textContent = icon
    var strong = document.createElement('div')
    strong.textContent = title
    var detailEl = document.createElement('div')
    detailEl.textContent = detail || ''
    wrap.appendChild(big)
    wrap.appendChild(strong)
    wrap.appendChild(detailEl)
    if (filePath) {
      var a = document.createElement('a')
      a.href = downloadUrl(filePath)
      a.setAttribute('download', '')
      a.className = 'action primary'
      a.textContent = '下载到本机'
      wrap.appendChild(a)
    }
    el.pvBody.textContent = ''
    el.pvBody.appendChild(wrap)
  }

  function escapeHtml(text) {
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }

  function inlineMarkdown(text) {
    var out = escapeHtml(text)
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>')
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    out = out.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
    return out
  }

  function renderMarkdown(text) {
    var lines = String(text).split(/\r?\n/)
    var html = []
    var inCode = false
    var codeLines = []
    var listType = ''
    function closeList() {
      if (listType) { html.push('</' + listType + '>'); listType = '' }
    }
    for (var i = 0; i < lines.length; i += 1) {
      var line = lines[i]
      if (/^```/.test(line)) {
        if (inCode) {
          html.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>')
          codeLines = []
          inCode = false
        } else {
          closeList()
          inCode = true
        }
        continue
      }
      if (inCode) { codeLines.push(line); continue }
      if (/^\s*$/.test(line)) { closeList(); continue }
      var heading = /^(#{1,6})\s+(.*)$/.exec(line)
      if (heading) {
        closeList()
        var level = heading[1].length
        html.push('<h' + level + '>' + inlineMarkdown(heading[2]) + '</h' + level + '>')
        continue
      }
      if (/^\s*([-*+])\s+/.test(line)) {
        if (listType !== 'ul') { closeList(); html.push('<ul>'); listType = 'ul' }
        html.push('<li>' + inlineMarkdown(line.replace(/^\s*([-*+])\s+/, '')) + '</li>')
        continue
      }
      if (/^\s*\d+\.\s+/.test(line)) {
        if (listType !== 'ol') { closeList(); html.push('<ol>'); listType = 'ol' }
        html.push('<li>' + inlineMarkdown(line.replace(/^\s*\d+\.\s+/, '')) + '</li>')
        continue
      }
      if (/^>\s?/.test(line)) {
        closeList()
        html.push('<blockquote>' + inlineMarkdown(line.replace(/^>\s?/, '')) + '</blockquote>')
        continue
      }
      if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) {
        closeList()
        html.push('<hr>')
        continue
      }
      closeList()
      html.push('<p>' + inlineMarkdown(line) + '</p>')
    }
    if (inCode) html.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>')
    closeList()
    return html.join('\n')
  }

  function parseDelimited(text, delimiter) {
    var rows = []
    var row = []
    var field = ''
    var quoted = false
    var source = String(text)
    for (var i = 0; i < source.length; i += 1) {
      var ch = source[i]
      if (quoted) {
        if (ch === '"') {
          if (source[i + 1] === '"') { field += '"'; i += 1 }
          else quoted = false
        } else field += ch
        continue
      }
      if (ch === '"') { quoted = true; continue }
      if (ch === delimiter) { row.push(field); field = ''; continue }
      if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; continue }
      if (ch === '\r') continue
      field += ch
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row) }
    return rows
  }

  function buildTable(text, delimiter) {
    var rows = parseDelimited(text, delimiter).slice(0, 300)
    var table = document.createElement('table')
    table.className = 'grid'
    rows.forEach(function (cells, rowIndex) {
      var tr = document.createElement('tr')
      cells.slice(0, 60).forEach(function (cell) {
        var td = document.createElement(rowIndex === 0 ? 'th' : 'td')
        td.textContent = cell
        tr.appendChild(td)
      })
      table.appendChild(tr)
    })
    table.style.flex = '0 0 auto'
    return table
  }

  // ── text preview + online editor ─────────────────────────────────────────

  function renderTextPreview(filePath, e, entry) {
    var seq = state.previewSeq
    var reading = document.createElement('div')
    reading.className = 'empty'
    reading.textContent = '读取中…'
    el.pvBody.textContent = ''
    el.pvBody.appendChild(reading)
    getJson('/-/files/api/text?path=' + enc(filePath) + '&maxBytes=' + TEXT_LIMIT).then(function (data) {
      if (seq !== state.previewSeq) return
      if (data.binary) {
        previewMessage('🧩', '看起来是二进制文件', '无法按文本预览，请下载后打开。', filePath)
        return
      }
      if (data.truncated) {
        el.pvMeta.textContent = (entry && entry.size !== null ? fmtSize(entry.size) + ' · ' : '') + '仅显示前 ' + fmtSize(TEXT_LIMIT)
      }
      var ui = previewShell([actionButton('编辑', '在线编辑并保存（Ctrl+S）'), actionButton('下载')])
      ui.bar.firstChild.addEventListener('click', function () {
        openEditor(ui, filePath, { text: data.text, mtimeMs: data.mtimeMs, size: data.size })
      })
      ui.bar.lastChild.addEventListener('click', function () { window.location.href = downloadUrl(filePath) })
      if (e === '.md' || e === '.markdown') {
        var mdWrap = document.createElement('div')
        mdWrap.className = 'md'
        mdWrap.innerHTML = renderMarkdown(data.text)
        ui.holder.appendChild(mdWrap)
        return
      }
      if (e === '.json' || e === '.jsonc') {
        var pretty = data.text
        if (!data.truncated) {
          try { pretty = JSON.stringify(JSON.parse(data.text), null, 2) } catch (err) { pretty = data.text }
        }
        var preJson = document.createElement('pre')
        preJson.textContent = pretty
        ui.holder.appendChild(preJson)
        return
      }
      if (e === '.csv' || e === '.tsv') {
        var wrap = document.createElement('div')
        wrap.style.cssText = 'overflow:auto;flex:1;min-height:0'
        wrap.appendChild(buildTable(data.text, e === '.csv' ? ',' : '\t'))
        ui.holder.appendChild(wrap)
        return
      }
      var pre = document.createElement('pre')
      pre.textContent = data.text
      ui.holder.appendChild(pre)
    }).catch(function (error) {
      previewMessage('⚠️', '读取失败', error.message, filePath)
    })
  }

  function openEditor(ui, filePath, initial) {
    var textarea = document.createElement('textarea')
    textarea.className = 'editor'
    textarea.spellcheck = false
    textarea.value = initial.text
    var expected = { mtimeMs: initial.mtimeMs, size: initial.size }
    var saveButton = actionButton('保存', 'Ctrl+S')
    var cancelButton = actionButton('取消')
    var status = document.createElement('span')
    status.style.cssText = 'font-size:12px;color:var(--muted);margin-left:4px'
    status.textContent = '未修改'
    ui.bar.textContent = ''
    ui.bar.appendChild(saveButton)
    ui.bar.appendChild(cancelButton)
    ui.bar.appendChild(status)
    ui.holder.textContent = ''
    ui.holder.style.alignItems = 'stretch'
    ui.holder.appendChild(textarea)
    function setStatus(text, isError) {
      status.textContent = text
      status.style.color = isError ? 'var(--danger)' : 'var(--muted)'
    }
    var saving = false
    function save() {
      if (saving) return
      saving = true
      setStatus('保存中…', false)
      postJson('/-/files/api/write', { path: filePath, text: textarea.value, expected: expected })
        .then(function (body) {
          expected = { mtimeMs: body.mtimeMs, size: body.size }
          saving = false
          setStatus('已保存', false)
          toast('已保存：' + baseName(filePath), true)
          if (state.dir) loadDir(state.dir)
        })
        .catch(function (error) {
          saving = false
          setStatus('保存失败', true)
          toast('保存失败：' + error.message)
        })
    }
    textarea.addEventListener('input', function () { setStatus('未保存', true) })
    saveButton.addEventListener('click', save)
    cancelButton.addEventListener('click', function () {
      state.editor = null
      renderTextPreview(filePath, ext(filePath), null)
    })
    state.editor = { save: save, close: function () { state.editor = null } }
    textarea.focus()
  }

  // ── create / rename / delete ─────────────────────────────────────────────

  function createEntry(kind) {
    if (!state.dir) return
    var initial = kind === 'dir' ? '新建文件夹' : '新建文件.txt'
    var name = window.prompt(kind === 'dir' ? '新建文件夹名称' : '新建文件名（含扩展名）', initial)
    if (name === null) return
    name = name.trim()
    if (!name) return
    postJson('/-/files/api/create', { dir: state.dir, name: name, kind: kind })
      .then(function () { toast('已创建：' + name, true); loadDir(state.dir) })
      .catch(function (error) { toast('新建失败：' + error.message) })
  }

  function renameSelection() {
    var items = selectedPaths()
    if (items.length !== 1) return
    var source = items[0]
    var name = window.prompt('重命名为', baseName(source))
    if (name === null) return
    name = name.trim()
    if (!name || name === baseName(source)) return
    postJson('/-/files/api/rename', { path: source, name: name })
      .then(function (body) { toast('已重命名', true); loadDir(parentDir(body.path)) })
      .catch(function (error) { toast('重命名失败：' + error.message) })
  }

  function deleteSelection(permanent) {
    var items = selectedPaths()
    if (items.length === 0) return
    postJson('/-/files/api/delete', { paths: items, permanent: permanent })
      .then(function (body) {
        var results = body.results || []
        var failed = results.filter(function (item) { return !item.ok })
        if (failed.length > 0) toast(failed.length + ' 项删除失败：' + failed[0].error)
        else if (permanent) toast('已彻底删除 ' + results.length + ' 项')
        else toast('已移入回收目录：' + (body.trashDir || ''), true)
        state.selected = {}
        state.selectedCount = 0
        loadDir(state.dir)
      })
      .catch(function (error) { toast('删除失败：' + error.message) })
  }

  // ── lazy client-side renderers (vendored mammoth / SheetJS) ─────────────

  var scriptCache = {}
  var VENDOR_MAMMOTH = '/-/files/vendor/mammoth.browser.min.js'
  var VENDOR_XLSX = '/-/files/vendor/xlsx.full.min.js'

  function loadScript(url) {
    if (scriptCache[url]) return scriptCache[url]
    scriptCache[url] = new Promise(function (resolve, reject) {
      var script = document.createElement('script')
      script.src = url
      script.async = true
      script.onload = function () { resolve() }
      script.onerror = function () {
        delete scriptCache[url]
        reject(new Error('资源加载失败：' + url))
      }
      document.head.appendChild(script)
    })
    return scriptCache[url]
  }

  function ensureMammoth() {
    if (window.mammoth) return Promise.resolve(window.mammoth)
    return loadScript(VENDOR_MAMMOTH).then(function () {
      if (!window.mammoth) throw new Error('mammoth 未就绪')
      return window.mammoth
    })
  }

  function ensureXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX)
    return loadScript(VENDOR_XLSX).then(function () {
      if (!window.XLSX) throw new Error('SheetJS 未就绪')
      return window.XLSX
    })
  }

  function fetchBytes(filePath) {
    return fetch(rawUrl(filePath)).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (text) {
          var message = text
          try { message = JSON.parse(text).error || text } catch (err) {}
          throw new Error(message || ('HTTP ' + res.status))
        })
      }
      return res.arrayBuffer()
    })
  }

  function firstChild(ui) { return ui.bar.firstChild }

  function previewShell(buttons) {
    var shell = document.createElement('div')
    shell.style.cssText = 'display:flex;flex-direction:column;flex:1;min-height:0;width:100%'
    var bar = document.createElement('div')
    bar.style.cssText = 'padding:6px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:0 0 auto'
    var holder = document.createElement('div')
    holder.style.cssText = 'flex:1;display:flex;min-height:0;overflow:auto'
    ;(buttons || []).forEach(function (button) { bar.appendChild(button) })
    shell.appendChild(bar)
    shell.appendChild(holder)
    el.pvBody.textContent = ''
    el.pvBody.appendChild(shell)
    return { shell: shell, bar: bar, holder: holder }
  }

  function actionButton(label, title) {
    var button = document.createElement('button')
    button.type = 'button'
    button.className = 'tool'
    button.textContent = label
    if (title) button.title = title
    return button
  }

  function progressPanel(label) {
    var wrap = document.createElement('div')
    wrap.className = 'empty'
    var icon = document.createElement('div')
    icon.className = 'big'
    icon.textContent = '⏳'
    var text = document.createElement('div')
    text.textContent = label
    var hint = document.createElement('div')
    hint.style.cssText = 'font-size:12px;color:var(--muted)'
    var track = document.createElement('div')
    track.className = 'indet'
    track.appendChild(document.createElement('div'))
    wrap.appendChild(icon)
    wrap.appendChild(text)
    wrap.appendChild(hint)
    wrap.appendChild(track)
    var started = Date.now()
    var timer = setInterval(function () {
      hint.textContent = '已等待 ' + (Math.round((Date.now() - started) / 100) / 10) + ' 秒 · 首次通常 10–15 秒'
    }, 200)
    return {
      el: wrap,
      setText: function (value) { text.textContent = value },
      stop: function () { clearInterval(timer) }
    }
  }

  /** Strip active content from mammoth HTML before it touches our DOM. */
  function sanitizeHtml(html) {
    var template = document.createElement('template')
    template.innerHTML = html
    ;['script', 'style', 'iframe', 'object', 'embed', 'link', 'meta', 'base', 'form'].forEach(function (tag) {
      var nodes = template.content.querySelectorAll(tag)
      for (var i = 0; i < nodes.length; i += 1) nodes[i].parentNode.removeChild(nodes[i])
    })
    var nodes = template.content.querySelectorAll('*')
    for (var i = 0; i < nodes.length; i += 1) {
      var node = nodes[i]
      for (var j = node.attributes.length - 1; j >= 0; j -= 1) {
        var attr = node.attributes[j]
        var name = attr.name.toLowerCase()
        var value = attr.value.trim()
        if (name.indexOf('on') === 0) { node.removeAttribute(attr.name); continue }
        if (name === 'src' || name === 'href' || name === 'xlink:href') {
          var lower = value.toLowerCase().replace(/\s+/g, '')
          var safe = lower.indexOf('http://') === 0 || lower.indexOf('https://') === 0 ||
            lower.indexOf('mailto:') === 0 || lower.indexOf('data:image/') === 0 ||
            (name === 'href' && value.charAt(0) === '#')
          if (!safe) node.removeAttribute(attr.name)
        }
      }
      if (node.tagName === 'A') {
        node.setAttribute('target', '_blank')
        node.setAttribute('rel', 'noreferrer')
      }
    }
    return template.innerHTML
  }

  function renderDocxFast(filePath) {
    var seq = state.previewSeq
    var panel = progressPanel('正在解析 docx（客户端快速预览）…')
    el.pvBody.textContent = ''
    el.pvBody.appendChild(panel.el)
    Promise.all([fetchBytes(filePath), ensureMammoth()]).then(function (results) {
      if (seq !== state.previewSeq) return
      panel.setText('正在排版…')
      return results[1].convertToHtml({ arrayBuffer: results[0] }).then(function (result) {
        if (seq !== state.previewSeq) return
        panel.stop()
        var ui = previewShell()
        var convertButton = actionButton('LibreOffice 精排', '用 Host 的 LibreOffice 转 PDF，排版更接近 Word；首次约 10–15 秒')
        var downloadButton = actionButton('下载')
        var meta = document.createElement('span')
        meta.style.cssText = 'font-size:12px;color:var(--muted)'
        if (result.messages && result.messages.length > 0) meta.textContent = '解析提示 ' + result.messages.length + ' 条'
        ui.bar.appendChild(convertButton)
        ui.bar.appendChild(downloadButton)
        ui.bar.appendChild(meta)
        var view = document.createElement('div')
        view.className = 'docxView'
        view.innerHTML = sanitizeHtml(result.value)
        ui.holder.appendChild(view)
        convertButton.addEventListener('click', function () { renderOfficePdf(filePath) })
        downloadButton.addEventListener('click', function () { window.location.href = downloadUrl(filePath) })
      })
    }).catch(function (error) {
      if (seq !== state.previewSeq) return
      panel.stop()
      previewMessage('📘', 'docx 快速预览失败', error.message + '（可直接下载）', filePath)
    })
  }

  function renderOfficePdf(filePath) {
    var seq = state.previewSeq
    var name = baseName(filePath)
    var panel = progressPanel('LibreOffice 正在转换…')
    el.pvBody.textContent = ''
    el.pvBody.appendChild(panel.el)
    fetch('/-/files/api/office?path=' + enc(filePath)).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (text) {
          var message = text
          try { message = JSON.parse(text).error || text } catch (err) {}
          throw new Error(message || ('HTTP ' + res.status))
        })
      }
      return res.blob()
    }).then(function (blob) {
      if (seq !== state.previewSeq) return
      panel.stop()
      var ui = previewShell([actionButton('下载')])
      firstChild(ui).addEventListener('click', function () { window.location.href = downloadUrl(filePath) })
      var url = URL.createObjectURL(blob)
      var frame = document.createElement('iframe')
      frame.src = url
      frame.title = name || 'PDF'
      frame.style.cssText = 'flex:1;width:100%;border:0;min-height:0;background:#fff'
      ui.holder.style.overflow = 'hidden'
      ui.holder.appendChild(frame)
    }).catch(function (error) {
      if (seq !== state.previewSeq) return
      panel.stop()
      previewMessage('📘', 'Office 转换失败', error.message + '（可直接下载）', filePath)
    })
  }

  function renderSheet(filePath) {
    var seq = state.previewSeq
    var panel = progressPanel('正在解析表格（客户端，大文件可能稍慢）…')
    el.pvBody.textContent = ''
    el.pvBody.appendChild(panel.el)
    Promise.all([fetchBytes(filePath), ensureXlsx()]).then(function (results) {
      if (seq !== state.previewSeq) return
      var XLSX = results[1]
      var workbook = null
      var failure = null
      try {
        workbook = XLSX.read(new Uint8Array(results[0]), {
          type: 'array', dense: true, cellNF: true, cellFormula: true, cellStyles: true,
        })
      } catch (error) {
        failure = error
      }
      if (workbook === null) {
        panel.stop()
        previewMessage('📊', '表格解析失败', (failure && failure.message ? failure.message : '未知错误') + '（可下载后用本地表格软件打开）', filePath)
        return
      }
      panel.stop()
      var sheetNames = (workbook.SheetNames || []).slice(0, SHEET_MAX_SHEETS)
      if (sheetNames.length === 0) {
        previewMessage('📊', '工作簿里没有工作表', '', filePath)
        return
      }
      var ui = previewShell([actionButton('下载'), actionButton('编辑单元格', '点单元格改值；只影响预览副本'), actionButton('另存为副本', '把当前编辑结果保存成新 xlsx，不改原文件')])
      firstChild(ui).addEventListener('click', function () { window.location.href = downloadUrl(filePath) })
      var editButton = ui.bar.children[1]
      var saveButton = ui.bar.children[2]
      var tabs = document.createElement('div')
      tabs.className = 'sheetTabs'
      var note = document.createElement('div')
      note.className = 'sheetNote'
      ui.shell.insertBefore(tabs, ui.holder)
      ui.shell.appendChild(note)
      var activeIndex = 0
      var editing = false
      var dirty = false
      function updateNote(extra) {
        var parts = []
        parts.push('工作表「' + sheetNames[activeIndex] + '」' + extra)
        parts.push('编辑/另存会丢图表、透视表、条件格式等高级特性')
        if (dirty) parts.push('⚠ 有未另存的修改')
        note.textContent = parts.join(' · ')
      }
      function updateEditMode() {
        editButton.textContent = editing ? '退出编辑' : '编辑单元格'
        editButton.style.borderColor = editing ? 'var(--accent)' : ''
        editButton.style.color = editing ? 'var(--accent)' : ''
        var cells = ui.holder.querySelectorAll('td')
        for (var i = 0; i < cells.length; i += 1) cells[i].classList.toggle('editable', editing)
      }
      editButton.addEventListener('click', function () {
        editing = !editing
        updateEditMode()
      })
      function saveCopy() {
        var defaultName = baseName(filePath).replace(/\.(xlsx|xls|xlsm|ods)$/i, '') + '-已编辑.xlsx'
        var name = window.prompt('另存为（新文件名，不会覆盖原文件）', defaultName)
        if (name === null) return
        name = name.trim()
        if (!name) return
        if (!/\.xlsx$/i.test(name)) name += '.xlsx'
        var bytes
        try {
          bytes = XLSX.write(workbook, { type: 'array', bookType: 'xlsx', cellStyles: true, compression: true })
        } catch (error) {
          toast('生成 xlsx 失败：' + error.message)
          return
        }
        var blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })
        postBinary('/-/files/api/upload?path=' + enc(parentDir(filePath)), name, blob).then(function (body) {
          dirty = false
          toast('已另存为：' + (body && body.name ? body.name : name), true)
          if (state.dir) loadDir(state.dir)
        }).catch(function (error) {
          toast('另存失败：' + error.message)
        })
      }
      saveButton.addEventListener('click', saveCopy)
      function startCellEdit(td, sheetName, rowIndex, colIndex) {
        if (!editing) return
        var current = td.textContent
        var input = document.createElement('input')
        input.value = current
        td.classList.add('editing')
        td.textContent = ''
        td.appendChild(input)
        input.focus()
        input.select()
        var finished = false
        function finish(value, commit) {
          if (finished) return
          finished = true
          td.classList.remove('editing')
          if (!commit) {
            td.textContent = current
            return
          }
          td.textContent = value
          var sheet = workbook.Sheets[sheetName]
          var address = XLSX.utils.encode_cell({ r: rowIndex, c: colIndex })
          if (value === '') delete sheet[address]
          else if (/^-?\d+(\.\d+)?$/.test(value)) sheet[address] = { t: 'n', v: Number(value) }
          else sheet[address] = { t: 's', v: value }
          dirty = true
          note.textContent = '工作表「' + sheetName + '」有未另存的修改 · 编辑/另存会丢图表、透视表、条件格式等高级特性'
        }
        input.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') { event.preventDefault(); finish(input.value, true) }
          else if (event.key === 'Escape') { event.preventDefault(); finish('', false) }
        })
        input.addEventListener('blur', function () { finish(input.value, true) })
      }
      function showSheet(index) {
        activeIndex = index
        var buttons = tabs.querySelectorAll('.sheetTab')
        for (var k = 0; k < buttons.length; k += 1) buttons[k].classList.toggle('active', k === index)
        var sheetName = sheetNames[index]
        var sheet = workbook.Sheets[sheetName]
        var rows = []
        if (sheet !== undefined) {
          rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '', blankrows: true })
        }
        var maxCols = 0
        for (var r = 0; r < rows.length && r < SHEET_MAX_ROWS; r += 1) {
          if (rows[r].length > maxCols) maxCols = Math.min(rows[r].length, SHEET_MAX_COLS)
        }
        var maxRows = Math.min(rows.length, SHEET_MAX_ROWS)
        var budget = SHEET_MAX_CELLS
        var table = document.createElement('table')
        table.className = 'grid'
        var body = document.createDocumentFragment()
        for (var i = 0; i < maxRows; i += 1) {
          if (budget <= 0) { maxRows = i; break }
          var tr = document.createElement('tr')
          var cols = Math.min(rows[i].length, maxCols)
          for (var c = 0; c < cols; c += 1) {
            var cell = document.createElement(i === 0 ? 'th' : 'td')
            cell.textContent = rows[i][c]
            if (i > 0) {
              cell.dataset.r = String(i)
              cell.dataset.c = String(c)
              cell.classList.toggle('editable', editing)
              cell.addEventListener('click', (function (targetCell, name) {
                return function () {
                  startCellEdit(targetCell, name, Number(targetCell.dataset.r), Number(targetCell.dataset.c))
                }
              })(cell, sheetName))
            }
            tr.appendChild(cell)
            budget -= 1
          }
          body.appendChild(tr)
        }
        table.appendChild(body)
        table.style.flex = '0 0 auto'
        ui.holder.style.alignItems = 'flex-start'
        ui.holder.textContent = ''
        ui.holder.appendChild(table)
        var parts = []
        parts.push('：' + rows.length + ' 行 × ' + maxCols + ' 列')
        if (rows.length > maxRows) parts.push('仅显示前 ' + maxRows + ' 行')
        if (maxCols >= SHEET_MAX_COLS) parts.push('仅显示前 ' + SHEET_MAX_COLS + ' 列')
        if (budget <= 0) parts.push('已达 ' + SHEET_MAX_CELLS + ' 单元格上限')
        updateNote(parts.join(' '))
      }
      sheetNames.forEach(function (sheetName, index) {
        var button = document.createElement('button')
        button.type = 'button'
        button.className = 'sheetTab'
        button.textContent = sheetName
        button.addEventListener('click', function () { showSheet(index) })
        tabs.appendChild(button)
      })
      showSheet(activeIndex)
    }).catch(function (error) {
      if (seq !== state.previewSeq) return
      panel.stop()
      previewMessage('📊', '表格读取失败', error.message + '（可下载后用本地表格软件打开）', filePath)
    })
  }

  function postBinary(url, fileName, blob) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest()
      xhr.open('POST', url)
      xhr.setRequestHeader('x-file-name', encodeURIComponent(fileName))
      xhr.setRequestHeader('content-type', 'application/octet-stream')
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          var body = {}
          try { body = JSON.parse(xhr.responseText) } catch (err) {}
          resolve(body)
        } else {
          var message = xhr.responseText
          try { message = JSON.parse(xhr.responseText).error || message } catch (err) {}
          reject(new Error('HTTP ' + xhr.status + ' ' + message))
        }
      }
      xhr.onerror = function () { reject(new Error('网络错误')) }
      xhr.send(blob)
    })
  }

  function openFile(filePath, entry) {
    state.editor = null
    var seq = ++state.previewSeq
    var name = baseName(filePath)
    el.pvName.textContent = name
    el.pvMeta.textContent = entry && entry.size !== null ? fmtSize(entry.size) : ''
    var e = ext(filePath)
    el.pvBody.textContent = ''

    if (inList(IMAGE, e)) {
      var img = document.createElement('img')
      img.src = rawUrl(filePath)
      img.alt = name
      el.pvBody.appendChild(img)
      return
    }
    if (e === '.pdf') {
      var frame = document.createElement('iframe')
      frame.src = rawUrl(filePath)
      frame.title = name
      el.pvBody.appendChild(frame)
      return
    }
    if (inList(VIDEO, e)) {
      var video = document.createElement('video')
      video.src = rawUrl(filePath)
      video.controls = true
      video.preload = 'metadata'
      el.pvBody.appendChild(video)
      return
    }
    if (inList(AUDIO, e)) {
      var audio = document.createElement('audio')
      audio.src = rawUrl(filePath)
      audio.controls = true
      audio.preload = 'metadata'
      el.pvBody.appendChild(audio)
      return
    }
    if (CLIENT_DOCX.indexOf(e) >= 0) {
      renderDocxFast(filePath)
      return
    }
    if (CLIENT_SHEET.indexOf(e) >= 0) {
      renderSheet(filePath)
      return
    }
    if (CONVERTIBLE.indexOf(e) >= 0) {
      renderOfficePdf(filePath)
      return
    }
    if (e === '.html' || e === '.htm') {
      getJson('/-/files/api/text?path=' + enc(filePath) + '&maxBytes=' + TEXT_LIMIT).then(function (data) {
        if (seq !== state.previewSeq) return
        var ui = previewShell([
          actionButton('渲染（禁用脚本）'),
          actionButton('源码'),
          actionButton('编辑'),
          actionButton('下载'),
        ])
        var renderButton = ui.bar.children[0]
        var sourceButton = ui.bar.children[1]
        var editButton = ui.bar.children[2]
        var downloadButton = ui.bar.children[3]
        function showRendered() {
          var doc = '<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data: https: http:; font-src data:">' + data.text
          var htmlFrame = document.createElement('iframe')
          htmlFrame.setAttribute('sandbox', '')
          htmlFrame.srcdoc = doc
          htmlFrame.style.cssText = 'flex:1;width:100%;border:0;background:#fff'
          ui.holder.textContent = ''
          ui.holder.appendChild(htmlFrame)
        }
        function showSource() {
          var pre = document.createElement('pre')
          pre.textContent = data.text
          ui.holder.textContent = ''
          ui.holder.appendChild(pre)
        }
        renderButton.addEventListener('click', showRendered)
        sourceButton.addEventListener('click', showSource)
        editButton.addEventListener('click', function () {
          openEditor(ui, filePath, { text: data.text, mtimeMs: data.mtimeMs, size: data.size })
        })
        downloadButton.addEventListener('click', function () { window.location.href = downloadUrl(filePath) })
        showRendered()
      }).catch(function (error) {
        previewMessage('⚠️', '读取失败', error.message, filePath)
      })
      return
    }
    if (inList(TEXT, e)) {
      renderTextPreview(filePath, e, entry)
      return
    }
    previewMessage('📦', '此类型无法在网页内预览', '请下载到本机后用本地应用打开。', filePath)
  }

  // ── wiring ──────────────────────────────────────────────────────────────

  el.jumpForm.addEventListener('submit', function (evt) {
    evt.preventDefault()
    var value = el.pathInput.value.trim()
    if (!value) return
    var target = value
    if (!/^[a-zA-Z]:[\\/]/.test(target) && target.charAt(0) !== '/') {
      if (state.dir) target = joinPath(state.dir, target)
    }
    loadDir(target)
  })
  el.refreshBtn.addEventListener('click', function () {
    if (state.dir) loadDir(state.dir)
  })
  el.copyBtn.addEventListener('click', copySelection)
  el.pasteBtn.addEventListener('click', pasteClipboard)
  el.newFileBtn.addEventListener('click', function () { createEntry('file') })
  el.newDirBtn.addEventListener('click', function () { createEntry('dir') })
  el.renameBtn.addEventListener('click', renameSelection)
  el.deleteBtn.addEventListener('click', function () {
    var items = selectedPaths()
    if (items.length === 0) return
    var moveToTrash = window.confirm('删除 ' + items.length + ' 项？\n\n确定 = 移入回收目录（可找回）\n取消 = 下一步可选择彻底删除')
    if (moveToTrash) {
      deleteSelection(false)
      return
    }
    if (window.confirm('要彻底删除 ' + items.length + ' 项吗？此操作不可恢复。')) deleteSelection(true)
  })
  el.zipBtn.addEventListener('click', function () {
    if (!state.dir) return
    var paths = selectedPaths()
    if (paths.length === 0) paths = [state.dir]
    window.open(zipUrl(paths), '_blank')
  })
  function selectAll(on) {
    state.selected = {}
    state.selectedCount = 0
    if (on) {
      state.entries.forEach(function (entry) {
        state.selected[entry.path] = true
        state.selectedCount += 1
      })
    }
    el.list.querySelectorAll('.row').forEach(function (row) {
      row.classList.toggle('selected', on)
      var box = row.querySelector('input[type=checkbox]')
      if (box) box.checked = on
    })
    updateToolbar()
  }
  el.selAll.addEventListener('change', function () { selectAll(el.selAll.checked) })
  el.selAllHead.addEventListener('change', function () { selectAll(el.selAllHead.checked) })

  document.addEventListener('keydown', function (evt) {
    var tag = (evt.target && evt.target.tagName) || ''
    if ((evt.ctrlKey || evt.metaKey) && evt.key.toLowerCase() === 's') {
      if (state.editor) {
        evt.preventDefault()
        state.editor.save()
        return
      }
    }
    if (tag === 'INPUT' || tag === 'TEXTAREA') return
    if ((evt.ctrlKey || evt.metaKey) && evt.key.toLowerCase() === 'c') {
      if (state.selectedCount > 0) { evt.preventDefault(); copySelection() }
    }
    if ((evt.ctrlKey || evt.metaKey) && evt.key.toLowerCase() === 'v') {
      if (state.clipboard) { evt.preventDefault(); pasteClipboard() }
    }
    if ((evt.ctrlKey || evt.metaKey) && evt.key.toLowerCase() === 'a') {
      evt.preventDefault()
      selectAll(true)
    }
  })

  getJson('/-/files/api/roots').then(function (data) {
    state.roots = data.roots || []
    state.home = typeof data.home === 'string' && data.home.length > 0 ? data.home : null
    renderRoots()
    var param = new URL(location.href).searchParams.get('path')
    if (param) {
      getJson('/-/files/api/list?path=' + enc(param)).then(function (listData) {
        state.dir = listData.path
        el.pathInput.value = listData.path
        setUrl(listData.path)
        renderRoots()
        renderCrumbs(listData.path)
        renderList(listData)
        var found = null
        listData.entries.forEach(function (item) { if (item.path.toLowerCase() === param.toLowerCase()) found = item })
        if (found && !found.isDir) openFile(param, found)
      }).catch(function () {
        var parent = parentDir(param)
        getJson('/-/files/api/list?path=' + enc(parent)).then(function (listData) {
          state.dir = listData.path
          el.pathInput.value = listData.path
          setUrl(listData.path)
          renderRoots()
          renderCrumbs(listData.path)
          renderList(listData)
          var found = null
          listData.entries.forEach(function (item) { if (item.path.toLowerCase() === param.toLowerCase()) found = item })
          openFile(param, found)
        }).catch(function (error) { toast('打开失败：' + error.message) })
      })
    } else {
      openHome()
    }
  }).catch(function (error) {
    toast('读取根目录失败：' + error.message)
  })
})()
</script>
</body>
